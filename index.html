<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>祝笑盈 · 考研顺利上岸</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui,
        "PingFang SC", "Microsoft YaHei", sans-serif;
      /* 更偏温柔一点的渐变色 */
      background: radial-gradient(circle at top, #ffe1f0 0%, #f8c3d9 22%, #9b87ff 70%, #2b1055 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      color: #fff7f5;
      overflow: hidden;
    }

    body.blessing {
      animation: bgGlow 6s ease-in-out infinite alternate;
    }

    @keyframes bgGlow {
      from { filter: brightness(1); }
      to   { filter: brightness(1.16); }
    }

    /* 背景星光层，可以稍微加点朦胧感 */
    .star-layer {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      background-image:
        radial-gradient(circle at 10% 20%, rgba(255,255,255,0.45) 0, transparent 45%),
        radial-gradient(circle at 80% 10%, rgba(255,255,255,0.3) 0, transparent 50%),
        radial-gradient(circle at 50% 80%, rgba(255,255,255,0.32) 0, transparent 55%);
      opacity: 0.23;
      mix-blend-mode: screen;
    }

    /* 飘动的“上岸符咒”层 */
    .charm-layer {
      position: fixed;
      inset: 0;
      overflow: hidden;
      pointer-events: none;
      z-index: 1;
    }

    .charm {
      position: absolute;
      bottom: -3rem;
      font-size: 1.08rem;
      color: #ffeaa7;
      text-shadow:
        0 0 6px rgba(0, 0, 0, 0.45),
        0 0 14px rgba(255, 234, 167, 0.9);
      animation: floatUp 9s linear forwards;
      opacity: 0;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(0) translateX(0) scale(0.9);
        opacity: 0;
      }
      10% {
        opacity: 1;
      }
      60% {
        opacity: 1;
      }
      100% {
        transform: translateY(-120vh) translateX(-30px) scale(1.2);
        opacity: 0;
      }
    }

    /* 中央卡片 */
    .card {
      position: relative;
      z-index: 2;
      width: min(92vw, 540px);
      padding: 26px 24px 28px;
      background: rgba(26, 10, 47, 0.78);
      border-radius: 22px;
      border: 1px solid rgba(255, 230, 250, 0.6);
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(16px);
      text-align: center;
      animation: fadeInUp 1.1s ease forwards;
    }

    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(26px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card-header {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
      font-size: 0.9rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      opacity: 0.9;
    }

    .dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #ffd56b;
      box-shadow: 0 0 10px rgba(255, 213, 107, 0.9);
    }

    .name {
      font-size: 2.3rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 6px;
    }

    .big-wish {
      font-size: 1.35rem;
      margin-bottom: 10px;
    }

    .big-wish span.key {
      font-size: 1.6rem;
      font-weight: 800;
      padding: 0 6px;
      color: #ffeaa7;
      text-shadow: 0 0 12px rgba(255, 234, 167, 0.95);
    }

    .date-tag {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255, 230, 250, 0.8);
      font-size: 0.82rem;
      gap: 4px;
      background: rgba(255, 255, 255, 0.08);
    }

    .date-tag-icon {
      font-size: 0.9rem;
    }

    #typewriter {
      min-height: 6.5em;
      margin: 6px auto 16px;
      font-size: 0.98rem;
      line-height: 1.7;
      text-align: left;
      white-space: pre-wrap;
      text-indent: 2em;
    }

    .cursor {
      display: inline-block;
      width: 0.8ch;
      border-right: 2px solid #ffeaa7;
      animation: blink 0.8s step-end infinite;
    }

    @keyframes blink {
      0%, 50% { opacity: 1; }
      50.01%, 100% { opacity: 0; }
    }

    .subtitle {
      font-size: 0.9rem;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.8s ease, transform 0.8s ease;
      color: #ffe0ff;
    }

    .subtitle.show {
      opacity: 1;
      transform: translateY(0);
    }

    .btn {
      margin-top: 14px;
      padding: 9px 20px;
      border-radius: 999px;
      border: none;
      background: linear-gradient(135deg, #ffe29f, #ffa99f, #f9c5d1);
      color: #4a1a25;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.35);
      transform: translateY(0);
      transition: transform 0.15s ease, box-shadow 0.15s ease, opacity 0.4s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 28px rgba(0, 0, 0, 0.45);
    }

    .btn:active {
      transform: translateY(1px);
      box-shadow: 0 7px 18px rgba(0, 0, 0, 0.4);
    }

    .btn.disabled {
      opacity: 0;
      pointer-events: none;
    }

    .footer-note {
      margin-top: 10px;
      font-size: 0.82rem;
      opacity: 0.82;
    }

    .status-badge {
      margin-top: 6px;
      font-size: 0.84rem;
      color: #ffeaa7;
      opacity: 0;
      transform: translateY(4px);
      transition: opacity 0.9s ease, transform 0.9s ease;
    }

    .status-badge.show {
      opacity: 1;
      transform: translateY(0);
    }

    .status-badge span {
      padding: 2px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 230, 250, 0.8);
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(4px);
    }

    @media (max-width: 480px) {
      .card {
        padding: 22px 18px 24px;
      }
      .name {
        font-size: 2rem;
      }
      .big-wish {
        font-size: 1.22rem;
      }
      .big-wish span.key {
        font-size: 1.5rem;
      }
      #typewriter {
        font-size: 0.92rem;
      }
    }
  </style>
</head>
<body>
  <!-- 柔和星光层 -->
  <div class="star-layer"></div>

  <!-- “上岸”符咒漂浮层 -->
  <div class="charm-layer" id="charmLayer"></div>

  <!-- 中央卡片 -->
  <div class="card">
    <div class="card-header">
      <span class="dot"></span>
      <span>POSTGRAD EXAM BLESSING · 考研应援台</span>
      <span class="dot"></span>
    </div>

    <div class="name">笑盈</div>
    <div class="big-wish">
      祝你 <span class="key">考研顺利上岸</span>，
      一战成“硕”！
    </div>

    <div class="date-tag">
      <span class="date-tag-icon">📅</span>
      <span>考试日：2025 年 12 月 20 日</span>
    </div>

    <div id="typewriter"></div>

    <p class="subtitle" id="subtitle">
      你走过的每一段教室的路、做过的每一套卷子、记下的每一行笔记，<br>
      都不会辜负你。<br>
      放松心态，稳住节奏——考场上请相信自己，你已经足够优秀。
    </p>

    <button class="btn" id="blessBtn">点击开启考研上岸 Buff</button>

    <div class="status-badge" id="statusBadge">
      <span>考研结果：好消息已在路上（静候录取通知）✅</span>
    </div>

    <div class="footer-note">
      —— 来自那个一直希望和你一起迎接好消息的人
    </div>
  </div>

  <script>
    // 祝福内容，可以按你想法再微调
    const message =
      "笑盈，\n" +
      "2025 年 12 月 20 日，就要迎来你这一阶段最重要的一场考试。\n" +
      "这一年里，你无数次走进教室，从清晨到深夜，把时间一点点换成底气。\n\n" +
      "做过的每一套题、背过的每一个句子、\n" +
      "每一次学到疲惫却又咬牙多坚持的半个小时，\n" +
      "都悄悄地堆叠成了你现在的实力。\n\n" +
      "请你相信自己：\n" +
      "你已经足够努力、足够优秀，\n" +
      "只需要在考场上正常发挥，把平时的你搬过去就好。\n\n" +
      "愿你在几天后的考试里落笔有神、审题清晰、思路顺畅，\n" +
      "选择都对，大题都会，\n\n" +
      "无论结果怎样，我都站在你这边。\n" +
      "但我更相信的是——\n" +
      "这一次，你一定会考研上岸，在你想去的城市和学校遇见更闪耀的自己。"+
      "合肥～就在眼前啦，加油！！！\n" + ;

    const textEl = document.getElementById("typewriter");
    const blessBtn = document.getElementById("blessBtn");
    const charmLayer = document.getElementById("charmLayer");
    const subtitle = document.getElementById("subtitle");
    const statusBadge = document.getElementById("statusBadge");

    const cursorSpan = document.createElement("span");
    cursorSpan.className = "cursor";
    cursorSpan.innerHTML = "&nbsp;";

    let index = 0;
    let typing = false;
    let charmTimer = null;

    function typeWriter() {
      if (index === 0) {
        textEl.textContent = "";
        textEl.appendChild(cursorSpan);
      }

      if (index < message.length) {
        const ch = message.charAt(index);
        cursorSpan.insertAdjacentText("beforebegin", ch);
        index++;

        let delay = 52;
        if ("，。？！：；…".includes(ch)) {
          delay = 240;
        } else if (ch === "\n") {
          delay = 170;
        }

        setTimeout(typeWriter, delay);
      } else {
        setTimeout(() => {
          cursorSpan.remove();
          subtitle.classList.add("show");
          statusBadge.classList.add("show");
        }, 520);
      }
    }

    function createCharm() {
      const span = document.createElement("span");
      span.className = "charm";

      // 随机内容：考研相关小符咒
      const words = ["上岸", "必过", "稳了", "高分", "一志愿", "复试稳", "顺利录取"];
      span.textContent = words[Math.floor(Math.random() * words.length)];

      span.style.left = Math.random() * 100 + "%";
      span.style.animationDuration = 6 + Math.random() * 4 + "s";

      charmLayer.appendChild(span);

      setTimeout(() => {
        span.remove();
      }, 11000);
    }

    blessBtn.addEventListener("click", () => {
      if (typing) return;
      typing = true;

      // 按钮淡出 + 背景开始轻微发光
      blessBtn.classList.add("disabled");
      document.body.classList.add("blessing");

      // 先放一波“上岸符”
      for (let i = 0; i < 10; i++) {
        setTimeout(createCharm, i * 200);
      }
      charmTimer = setInterval(createCharm, 550);

      // 启动打字机效果
      setTimeout(typeWriter, 360);
    });

    window.addEventListener("beforeunload", () => {
      if (charmTimer) clearInterval(charmTimer);
    });
  </script>
</body>
</html>
